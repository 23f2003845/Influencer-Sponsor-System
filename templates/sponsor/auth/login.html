{% include 'layout/base.html' %} {% block body %} {% if message %}
<div class="alert alert-danger" role="alert">{{message}}</div>
{% endif %}

<div
  class="d-flex flex-column justify-content-center align-items-center"
  style="height: 100vh"
>
  <h2 class="mt-3 mb-3">Sponsor Registration</h2>
  <div class="card text-center" style="width: 35vw; padding: 10px">
    <form
      method="post"
      action="/sponsor/login"
      class="d-flex flex-column m-3"
      style="gap: 0.5rem"
    >
      <div class="input-group flex-nowrap">
        <input
          type="text"
          class="form-control"
          required
          name="username"
          id="username"
          placeholder="Username"
          aria-label="Username"
          aria-describedby="addon-wrapping"
        />
      </div>
      <div class="input-group flex-nowrap">
        <input
          type="password"
          class="form-control"
          required
          id="password"
          name="password"
          placeholder="Password"
          aria-label="Password"
          aria-describedby="addon-wrapping"
        />
        <button
          class="input-group-text"
          class="btn m-0 p-0"
          id="passwordToggle"
        >
          <ion-icon
            id="passwordIcon"
            name="eye-outline"
            style="font-size: 24px"
          ></ion-icon>
        </button>
      </div>

      <input type="submit" value="Submit" class="btn btn-primary" />
    </form>
    <span
      >Not a sponsor?
      <a href="/sponsor/register">Create an Account</a></span
    >
    <span
      >Want to 
      <a href="/influencer/register">become an influencer?</a></span
    >
  </div>
</div>

{% endblock %} {% block script %}

<script>
  const toggle = document.getElementById("passwordToggle");
  const passwordIcon = document.getElementById("passwordIcon");
  const passwordField = document.getElementById("password");

  toggle.addEventListener("click", (e) => {
    e.preventDefault();

    let currentlyShowing =
      passwordIcon.getAttribute("name") === "eye-off-outline";

    if (!currentlyShowing) {
      passwordField.setAttribute("type", "text");
      passwordIcon.setAttribute("name", "eye-off-outline");
    } else {
      passwordField.setAttribute("type", "password");
      passwordIcon.setAttribute("name", "eye-outline");
    }
  });
</script>

{% endblock %}
