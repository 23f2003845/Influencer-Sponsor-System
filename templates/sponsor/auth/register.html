{% include 'layout/base.html' %} 

{% block body %}

{% if message %}
<div class="alert alert-danger" role="alert">
  {{message}}
</div>
{% endif %}

<div class="d-flex flex-column justify-content-center align-items-center" style="height: 100vh;">
  <h2 class="mt-3 mb-3">Sponsor Registration</h2>
  <div class="card text-center" style="width: 35vw; padding: 10px;">
    <form action="/sponsor/register" method="post"  class="d-flex flex-column m-3" style="gap: 0.5rem;">
      <div class="input-group flex-nowrap">
        <input type="text" class="form-control" name="name" required id="name"  placeholder="Name" aria-label="Name" aria-describedby="addon-wrapping">
      </div>
      <div class="input-group flex-nowrap">
        <input type="text" class="form-control" required name="username" id="username"  placeholder="Username" aria-label="Username" aria-describedby="addon-wrapping">
      </div>
      <div class="input-group flex-nowrap">
        <input type="password" class="form-control" required id="password" name="password" placeholder="Password" aria-label="Password" aria-describedby="addon-wrapping">
        <button class="input-group-text"  class="btn m-0 p-0" id="passwordToggle"><ion-icon id="passwordIcon"  name="eye-outline" style="font-size: 24px;"></ion-icon></button>
      </div>
    <div class="input-group flex-nowrap">
        <input type="text" class="form-control" required id="industry" name="industry" placeholder="Enter your Industry" aria-label="Reach" aria-describedby="addon-wrapping">
      </div>
     <div class="input-group flex-nowrap">
        <input type="number" class="form-control" required id="budget" name="budget" placeholder="Enter your Budget" aria-label="Niche" aria-describedby="addon-wrapping">
      </div>
         
      <input type="submit" value="Submit" class="btn btn-primary">
    </form>
    <span>Already a sponsor? <a href="/sponsor/login">Log in</a></span>
    <span>Want to <a href="/influencer/register">become an influencer?</a></span>
  </div>
</div>


{% endblock %}


{% block script %}

<script>
  const toggle = document.getElementById("passwordToggle");
  const passwordIcon = document.getElementById("passwordIcon")
  const passwordField = document.getElementById("password");


  toggle.addEventListener("click", (e) => {

    e.preventDefault()

    let currentlyShowing = passwordIcon.getAttribute("name") === "eye-off-outline";

    if (!currentlyShowing){
      passwordField.setAttribute("type", "text");
      passwordIcon.setAttribute("name", "eye-off-outline")
    }else{
      passwordField.setAttribute("type", "password");
      passwordIcon.setAttribute("name", "eye-outline")
    }
  })

  function createNewCategory(){
    const categoryName = document.getElementById("newCategory").value
    $.get(`/category/create/${categoryName}`)
    $('#addNewCategory').modal('hide');
    window.location.reload(); 
  }


</script>

{% endblock %}
