{% include 'layout/base.html' %} 

{% block body %}

{% if message %}
<div class="alert alert-danger" role="alert">
  {{message}}
</div>
{% endif %}

<div class="d-flex flex-column justify-content-center align-items-center" style="height: 100vh;">
  <h2 class="mt-3 mb-3">Influencer Registration</h2>
  <div class="card text-center" style="width: 35vw; padding: 10px;">
    <form action="/influencer/register" method="post"  class="d-flex flex-column m-3" style="gap: 0.5rem;">
      <div class="input-group flex-nowrap">
        <input type="text" class="form-control" name="name" required id="name"  placeholder="Name" aria-label="Name" aria-describedby="addon-wrapping">
      </div>
      <div class="input-group flex-nowrap">
        <input type="text" class="form-control" required name="username" id="username"  placeholder="Username" aria-label="Username" aria-describedby="addon-wrapping">
      </div>
      <div class="input-group flex-nowrap">
        <input type="password" class="form-control" required id="password" name="password" placeholder="Password" aria-label="Password" aria-describedby="addon-wrapping">
        <button class="input-group-text"  class="btn m-0 p-0" id="passwordToggle"><ion-icon id="passwordIcon"  name="eye-outline" style="font-size: 24px;"></ion-icon></button>
      </div>
      <div class="input-group flex-nowrap">
        <textarea class="form-control" id="bio" required maxlength="255" rows="5" name="bio" style="resize: none;"  placeholder="Enter a Bio for your profile." aria-label="Bio" aria-describedby="addon-wrapping"></textarea>
      </div>
      <div class="input-group flex-nowrap gap-1" style="width: 100%">
        <select class="selectpicker" style="width: 60%" data-live-search="true" name="category" id="category">
          {% for category in categories %}
            <option value={{category.id}}>{{category.name}}</option> 
          {% endfor %}
        </select>
        <div class="btn btn-primary d-flex gap-2 rounded justify-content-center align-items-center" data-bs-toggle="modal" data-bs-target="#addNewCategory"><ion-icon style="font-size: 24px !important; color: #ffffff;" name="add"></ion-icon>Category</div>

        <!-- Add New Category -->
        <div class="modal fade" id="addNewCategory" tabindex="-1" role="dialog" aria-labelledby="addNewCategory" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fs-5" id="addNewCategoryTitle">Create a new Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                </button>
              </div>
              <div class="modal-body">
                <input type="category" id="newCategory" class="form-control" placeholder="Create a new category"></input>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="createNewCategory()">Create</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    <div class="input-group flex-nowrap">
        <input type="text" class="form-control" required id="reach" name="reach" placeholder="Enter your Reach" aria-label="Reach" aria-describedby="addon-wrapping">
      </div>
     <div class="input-group flex-nowrap">
        <input type="text" class="form-control" required id="niche" name="niche" placeholder="Enter your Niche" aria-label="Niche" aria-describedby="addon-wrapping">
      </div>
         
      <input type="submit" value="Submit" class="btn btn-primary">
    </form>
    <span>Already an influencer? <a href="/influencer/login">Log in</a></span>
  </div>
</div>


{% endblock %}


{% block script %}

<script>
  const toggle = document.getElementById("passwordToggle");
  const passwordIcon = document.getElementById("passwordIcon")
  const passwordField = document.getElementById("password");


  toggle.addEventListener("click", (e) => {

    e.preventDefault()

    let currentlyShowing = passwordIcon.getAttribute("name") === "eye-off-outline";

    if (!currentlyShowing){
      passwordField.setAttribute("type", "text");
      passwordIcon.setAttribute("name", "eye-off-outline")
    }else{
      passwordField.setAttribute("type", "password");
      passwordIcon.setAttribute("name", "eye-outline")
    }
  })

  function createNewCategory(){
    const categoryName = document.getElementById("newCategory").value
    $.get(`/category/create/${categoryName}`)
    $('#addNewCategory').modal('hide');
    window.location.reload(); 
  }


</script>

{% endblock %}
